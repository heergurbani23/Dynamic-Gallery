<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        border: 1px solid black;
        display: flex;
    }
    .box{
        height: 100%;
        width: 25%;
        border: 1px solid black ;
    }
    img{
        width: 100%;
    }
    *{
        padding: 0%;
        margin: 0%;
        box-sizing: border-box;
    }
    
    
</style>
<body>
    <h1 align="center">Dynamic Gallery</h1>
   <div class="container">
    <div class="box">
       <img src="img1.png" alt="">
       <img src="img2.png" alt="">
       <img src="img3.png" alt="">
       <img src="img4.png" alt="">
    </div>
    
    <div class="box">
        <img src="img3.png" alt="">
       <img src="img4.png" alt="">
       <img src="img1.png" alt="">
       <img src="img2.png" alt="">
    </div>
    <div class="box">
        <img src="img4.png" alt="">
       <img src="img3.png" alt="">
       <img src="img2.png" alt="">
       <img src="img1.png" alt="">
    </div>
    <div class="box">
        <img src="img2.png" alt="">
       <img src="img1.png" alt="">
       <img src="img4.png" alt="">
       <img src="img3.png" alt="">
    </div>
   </div>
   
</html>
